name: Rust CI
on:
  push:
    branches: [next, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os != 'Windows'
        run: python scripts/interoperability.py target/release/uup-cli
      - if: runner.os == 'Windows'
        run: python scripts/interoperability.py target/release/uup-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: uup-cli-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/uup-cli
            target/release/uup-cli.exe
            README.md
            LICENSE
          if-no-files-found: error

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - run: cargo test --locked
